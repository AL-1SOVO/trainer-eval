server:
  port: 8080

spring:
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  ai:
    openai:
      # 修复：原来默认值是空串，而 Spring AI 的 OpenAiChatAutoConfiguration 会对
      # api-key 做 Assert.hasText → 未设置 DEEPSEEK_API_KEY 时**整个应用启动失败**
      # （连考试等与 AI 无关的接口都不可用）。改为非空占位值：
      # 应用可正常启动，AI 调用时才报鉴权错误。
      api-key: ${DEEPSEEK_API_KEY:${OPENAI_API_KEY:not-configured}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          # 修复：原默认值 deepseek-v4-flash 不是 DeepSeek 的真实模型名
          # （实测 GET /models 只返回 deepseek-flash / deepseek-v4-pro），
          # 此前能跑通只是被网关宽容路由到了 deepseek-flash。
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          temperature: 0.3
          max-tokens: 4096

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:dHJhaW5lci1ldmFsLXNlY3JldC1rZXktMjAyNC1qd3Qtc2lnbmluZy1ocy0yNTY=}
  access-token-ttl: 7200
  refresh-token-ttl: 604800

openai:
  api-key: ${DEEPSEEK_API_KEY:${OPENAI_API_KEY:not-configured}}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  temperature: 0.3
  max-tokens: 4096
  connect-timeout: 30s
  read-timeout: 120s

agent:
  tutor:
    max-iterations: 6
    history-window: 20
    history-ttl-hours: 168
    # 任务规划（P0.2）：auto 走启发式门（短消息/闲聊不规划，避免为展示而规划）；
    # always 每次强制规划；off 关闭。规划失败会自动退化成"走一步看一步"，不影响对话。
    planning-mode: ${AGENT_PLANNING_MODE:auto}
    max-plan-steps: 5
    # 单工具反思重试上限（P0.3）。只对"参数可调"的检索工具生效：
    # 成绩/错题类工具为空是"确实没数据"，重试只会白烧 token。
    max-tool-retries: 2
  # 多智能体协作（POST /api/v1/agent/chat/stream 带 mode=multi 时生效）
  # 三个角色各是一次完整模型调用，因此成本约为单智能体的 3~4 倍；
  # 换来的是"用独立上下文复核证据"，适合复杂/高风险的问答场景。
  multi:
    # 资料员的工具循环轮次上限。比单智能体低：多智能体的重点是分工，不是更深的检索
    max-research-iterations: 4
    history-window: 10
    history-ttl-hours: 168

# 知识库服务（MimirQ）接入。对应《企业级RAG实施方案.md》阶段三 3.4。
# 检索链路：MimirQ → 本地混合检索(ngram+子串+RRF) → 子串兜底；
# MimirQ 不可用时自动降级并熔断，不影响系统其它功能。
mimirq:
  enabled: ${MIMIRQ_ENABLED:true}
  base-url: ${MIMIRQ_BASE_URL:http://localhost:8000}
  api-key: ${MIMIRQ_API_KEY:}
  retrieval-path: /api/v1/integrations/dify/retrieval
  timeout: 5s
  connect-timeout: 1500ms
  top-k: 6
  # 传给 MimirQ 的分数阈值。实测它只作用于向量通道，关键词通道的命中不受约束，
  # 所以还需要下面的 min-score 兜底。
  #
  # 当前语料（2 份文档 + 20 题 golden）的实测数据：
  #   golden 题命中最高分：min 0.60 / 中位 0.74 / max 0.81
  #   语料外问题最高分：    0.60 ~ 0.63
  #   两者在 0.60~0.63 重叠 → 阈值无法"干净地"区分相关与不相关。
  #
  # 取 0.7 的依据（不是拍脑袋）：它既能滤掉语料外的噪声，又不损失召回 ——
  # 被滤掉的 golden 命中由本地混合检索补回，实测 CHAIN 仍为
  #   hitRate 1.0000 / recall 1.0000 / MRR 1.0000（阈值 0.4 时 MRR 只有 0.9500）。
  # 代价与再调优触发条件：阈值偏高意味着部分查询依赖词面通道兜底。
  #   **语料变大后必须用同样的方法重测**（golden 分数分布 vs 语料外分数分布），
  #   再用 MIMIRQ_SCORE_THRESHOLD 覆盖，不要把这个值当成永久结论。
  score-threshold: ${MIMIRQ_SCORE_THRESHOLD:0.7}
  # 相关度下限：丢弃 score 低于它的命中。默认 0.01，等价于"只丢 score=0"——
  # 那些是 MimirQ 关键词通道的产物（不受 score_threshold 约束），
  # 会让语料外的问题也拿到"资料"并据此编造引用。词面匹配本地已经做了，丢弃不损失召回。
  min-score: ${MIMIRQ_MIN_SCORE:0.01}
  # MimirQ 的扩展字段：fast 会关闭昂贵的回退/重排分支，适合 Agent 在线对话
  latency-profile: fast
  max-courses-per-query: 5
  # 连续失败达到阈值后熔断，冷却结束后半开重试
  failure-threshold: 3
  cooldown: 60s
  knowledge-id-pattern: course-{courseId}
  # ------------------------------------------------------------------ 自动灌库（写入侧）
  # 检索只要一个 API Key；写入要账号密码登录换 JWT，两者依赖不同，所以开关分开。
  # 关闭时：资料仍会自动切块进本地索引，员工能搜到；只是拿不到 MimirQ 的混合召回+重排。
  ingest:
    enabled: ${MIMIRQ_INGEST_ENABLED:true}
    username: ${MIMIRQ_USERNAME:}
    password: ${MIMIRQ_PASSWORD:}
  login-path: /api/v1/auth/login
  datasets-path: /api/v1/datasets
  documents-path: /api/v1/documents

rag:
  security-trimming:
    # 裁剪总开关。关成 false 会让学生检索到未发布课程的资料，仅建议本地调试使用。
    enabled: ${RAG_TRIMMING_ENABLED:true}
    # 裁剪模式：
    #   PUBLISHED（默认）—— 员工可检索所有"已发布"课程的资料，与课程列表接口可见范围一致。
    #     为什么默认是它：员工检索的目的是"快速查企业培训文档"，若限定为已报名课程，
    #     会出现"在课程页看得见、在搜索里搜不到"的自相矛盾，且不引入新的暴露面
    #     （已发布课程的资料本来就能从课程详情页读到）。
    #   ENROLLED —— 只能检索已报名课程，适合资料按部门/项目保密的场景。
    mode: ${RAG_TRIMMING_MODE:PUBLISHED}

app:
  upload:
    path: D:/trainer-eval/uploads

# ---------------------------------------------------------------------------
# MCP（Model Context Protocol）外部工具接入
# ---------------------------------------------------------------------------
# 目的：把"给 Agent 加一个工具"从"改 Java 代码 + 发版"变成"改一行配置"。
#
# 安全边界（三选一必须明确，否则不要开）：
#   ① server 列表只能来自本文件 —— stdio 传输等于在本机执行命令，
#      开放 API 动态添加 server 就等于开放远程命令执行。McpController 刻意没有增删接口。
#   ② allowed-roles 留空 = 仅管理员。MCP 工具没有用户身份，做不到本地工具那样的行级过滤，
#      所以默认取最保守值：把"忘记配置"的后果从"跨用户数据泄露"降级为"功能没生效"。
#   ③ 工具结果包 <data> 标签，与课程资料同等对待（系统提示词已声明其中指令不执行）。
#
# 默认关闭：没配 server 时 Agent 行为与没有这个功能完全一致。
mcp:
  enabled: ${MCP_ENABLED:false}
  default-timeout: 20s
  init-timeout: 15s
  # 所有 server 合计最多暴露多少工具（防止提示词被工具定义撑爆）
  max-tools: 64
  # 外部工具结果体积不可控，默认不写进链路追踪明细
  capture-tool-result: false
  servers:
    # 内置演示 server：仓库自带、零依赖（纯标准库 Python），用于验证接入链路是否真的通。
    # 起用方式：MCP_ENABLED=true MCP_DEMO_ENABLED=true，
    # 并把 MCP_DEMO_COMMAND / MCP_DEMO_SCRIPT 指向本机 python 与本仓库脚本。
    demo:
      enabled: ${MCP_DEMO_ENABLED:false}
      transport: stdio
      command: ${MCP_DEMO_COMMAND:python}
      args:
        - ${MCP_DEMO_SCRIPT:./mcp-demo-server/demo_mcp_server.py}
      description: 内置演示 MCP server（企业培训制度库 + 人时计算），用于验证 MCP 接入链路
      tool-prefix: "mcp_demo_"
      # 演示用：只给管理员。要让内训师也能用就改成 [MANAGER, TRAINER]
      allowed-roles:
        - MANAGER

# ---------------------------------------------------------------------------
# LLM/RAG/Agent 链路追踪（可观测性）
# ---------------------------------------------------------------------------
# 两段式设计，互不依赖：
#   ① 本地表 ai_trace —— 永远是主路径，不依赖任何外部服务，管理端"链路追踪"页直接查
#   ② Langfuse 导出  —— 可选，配了才发；异步、失败不影响业务
#
# 为什么默认走 otlp 而不是 /api/public/ingestion：
#   查 Langfuse 官方契约（fern/apis/server/definition/ingestion.yml）确认，
#   老的批次接口已 deprecated，Langfuse Cloud 自 2026-11-16 起只接受 score-create，
#   官方替代路径就是 POST /api/public/otel/v1/traces。
#   若自托管版本 < v3.22.0（没有 OTLP 端点），把 mode 改成 legacy 回退。
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  host: ${LANGFUSE_HOST:http://localhost:3000}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  mode: ${LANGFUSE_MODE:otlp}
  environment: ${LANGFUSE_ENVIRONMENT:dev}
  release: ${LANGFUSE_RELEASE:}
  service-name: trainer-eval
  # Agent 流量不高，默认全采；压测或量大时再调低
  sample-rate: ${LANGFUSE_SAMPLE_RATE:1.0}
  # 是否记录完整提示词与回答。合规敏感场景设 false，只留长度与摘要
  capture-content: ${LANGFUSE_CAPTURE_CONTENT:true}
  max-text-length: 4000
  timeout: 5s
  queue-capacity: 2000
  batch-size: 20

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/trainer_eval?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password:
      timeout: 3000ms

logging:
  level:
    com.trainereval: debug
